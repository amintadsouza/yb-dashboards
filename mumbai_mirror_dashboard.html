--amber);}.rag-r{background:var(--red-soft);color:var(--red);}.rag-dot{width:6px;height:6px;border-radius:50%;}.rag-g .rag-dot{background:var(--green);}.rag-a .rag-dot{background:var(--amber);}.rag-r .rag-dot{background:var(--red);}.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;align-items:start;width:100%;}.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}.goal-name{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;font-weight:600;}.goal-numbers{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}.goal-current{font-family:'Georgia',serif;font-size:20px;font-weight:700;}.goal-target{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;color:var(--text-muted);}.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}.progress-fill{height:100%;border-radius:3px;transition:width 0.4s ease;}.fill-g{background:var(--green);}.fill-a{background:var(--amber);}.fill-r{background:var(--red);}.goal-pct{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:10px;color:var(--text-muted);margin-top:5px;}.status-bar{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;align-items:center;margin-bottom:1.5rem;}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}.chart-card.full{grid-column:1/-1;}.chart-title{font-family:'Georgia',serif;font-size:13px;margin-bottom:2px;}.chart-sub{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;color:var(--text-muted);margin-bottom:12px;}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;}.legend-item{display:flex;align-items:center;gap:5px;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;color:var(--text-secondary);}.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}.table-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto;}.post-table{width:100%;border-collapse:collapse;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;}.post-table th{text-align:left;padding:10px 14px;color:var(--text-muted);font-weight:500;border-bottom:1px solid var(--border);background:var(--surface2);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;}.post-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}.post-table tr:last-child td{border-bottom:none;}.post-table tr:hover td{background:var(--surface2);}.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}.pill-carousel{background:var(--green-soft);color:var(--green);}.pill-reel{background:var(--amber-soft);color:var(--amber);}.pill-series{background:var(--blue-soft);color:var(--blue);}.month-chip{display:inline-flex;align-items:center;gap:6px;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;background:var(--accent-soft);border:1px solid rgba(200,168,75,0.3);border-radius:20px;padding:4px 12px;color:var(--amber);margin-bottom:1.25rem;}.info-note{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:10px;line-height:1.6;}.cmp-selectors{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem;}.cmp-select{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);cursor:pointer;}.cmp-vs{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.05em;}.dl-btn{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;border:1.5px solid var(--text-primary);background:var(--text-primary);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 0.15s;}.dl-btn:hover{background:transparent;color:var(--text-primary);}.report-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:12px;}.report-section-title{font-family:'Georgia',serif;font-size:14px;font-weight:700;margin-bottom:8px;}.report-text{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;}.post-review-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}.post-review-type{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}.post-review-title{font-family:'Georgia',serif;font-size:14px;font-weight:700;margin-bottom:12px;}.post-review-label{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}.post-review-body{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;}.footer{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11px;color:var(--text-muted);text-align:center;padding-top:1.5rem;margin-top:1.5rem;border-top:1px solid var(--border);}@media(max-width:600px){body{padding:1rem;}.chart-grid{grid-template-columns:1fr;}.chart-card.full{grid-column:1;}}</style></head><body><script>const CONFIG = {clientName: "Mumbai Mirror",platform: "Instagram",sheetCSVUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpIqZcAwMePP2lS5lNfkC2kIMmvrAVBo8SpV8Joua0vJ24aog275iQcGE_LP2S_t2g3gAlZrDYiG27/pub?gid=0&single=true&output=csv",engagementStart: "Nov 19, 2025",goalsStartDate:  "Apr 1, 2026",chapter2EndDate: "Jun 30, 2026",chapter3StartDate: "Jul 1, 2026",monthMap: {"Jan":"January","Feb":"February","Mar":"March","Apr":"April","May":"May","Jun":"June","Jul":"July","Aug":"August","Sep":"September","Oct":"October","Nov":"November","Dec":"December"},// Per-month targets — historical months have full breakdowns, Chapter 3 months use day-checkpoint targetsmonthlyTargets: {"Jan": { reach:1700000, followers:2000, er:4.5, likes:5000, comments:120, shares:600,  saves:250, reposts:50,  numReels:30, totalInteractions:6020,  profileVisits:null },"Feb": { reach:600000,  followers:500,  er:3.8, likes:12000,comments:150, shares:1200, saves:900, reposts:120, numReels:20, totalInteractions:14370, profileVisits:null },"Mar": { reach:750000,  followers:700,  er:3.1, likes:12000,comments:220, shares:2500, saves:900, reposts:280, numReels:24, totalInteractions:15900, profileVisits:null },"Apr": { reach:600000,  followers:2800, er:7.5, likes:null,  comments:null,shares:2500, saves:2000,reposts:null,numReels:30, totalInteractions:22000,profileVisits:6000  },"May": { reach:800000,  followers:3800, er:8.0, likes:null,  comments:null,shares:3200, saves:2400,reposts:null,numReels:30, totalInteractions:26000,profileVisits:9000  },"Jun": { reach:1000000, followers:5000, er:8.5, likes:null,  comments:null,shares:4000, saves:2800,reposts:null,numReels:30, totalInteractions:30000,profileVisits:14000 },"Jul": { reach:800000,  followers:9000, er:null,likes:null,  comments:null,shares:25000,saves:4000,reposts:null,numReels:20, totalInteractions:60000,profileVisits:10000 },"Aug": { reach:900000,  followers:12000,er:null,likes:null,  comments:null,shares:28000,saves:4500,reposts:null,numReels:20, totalInteractions:65000,profileVisits:11000 },"Sep": { reach:1000000, followers:15000,er:null,likes:null,  comments:null,shares:30000,saves:5000,reposts:null,numReels:20, totalInteractions:70000,profileVisits:12000 },},// Day 120/150/180 cumulative goals (Chapter 3)goals: {120: { followers:9000,  reach:800000,  er:null, saves:4000, shares:25000, profileVisits:10000, totalInteractions:60000, numReels:20, totalViews:null },150: { followers:12000, reach:900000,  er:null, saves:4500, shares:28000, profileVisits:11000, totalInteractions:65000, numReels:20, totalViews:null },180: { followers:15000, reach:1000000, er:null, saves:5000, shares:30000, profileVisits:12000, totalInteractions:70000, numReels:20, totalViews:null }},// Chapter 2 locked scorecard (Days 1-90, Apr-Jun)chapter2Scorecard: {followers:   { target:5000,  actual:7381,  label:"Followers" },saves:       { target:2800,  actual:14262, label:"Total saves" },shares:      { target:4000,  actual:85195, label:"Shares" },interactions:{ target:30000, actual:209182,label:"Total interactions" },reels:       { target:90,    actual:46,    label:"Reels published" },profileVisits:{ target:14000,actual:35686, label:"Profile visits" }}};</script><div id="app">  <div style="font-family:-apple-system,sans-serif;font-size:13px;color:#999;padding:2rem;text-align:center;">Loading dashboard…</div></div><script>Chart.register(ChartDataLabels);const _charts={};function destroyChart(id){if(_charts[id]){_charts[id].destroy();delete _charts[id];}}function makeChart(id,cfg){destroyChart(id);const el=document.getElementById(id);if(el)_charts[id]=new Chart(el,cfg);}function ragStatus(c,t){  if(!t||isNaN(c)||isNaN(t))return{rag:'a',label:'No target'};  const p=(c/t)*100;  if(p>=90)return{rag:'g',label:'On track'};  if(p>=65)return{rag:'a',label:'At risk'};  return{rag:'r',label:'Off track'};}function ragBadge(c,t,active){  if(!active)return`<span class="rag" style="background:var(--surface2);color:var(--text-muted);">Starts Apr 1</span>`;  const{rag,label}=ragStatus(c,t);  return`<span class="rag rag-${rag}"><span class="rag-dot"></span>${label}</span>`;}function progressBar(c,t,active){  if(!active)return`<div class="progress-track"><div class="progress-fill" style="width:0%;background:var(--border);"></div></div><div class="goal-pct" style="color:var(--text-muted);">Goal period not started</div>`;  const{rag}=ragStatus(c,t);  const p=Math.min(100,Math.round((c/t)*100));  return`<div class="progress-track"><div class="progress-fill fill-${rag}" style="width:${p}%"></div></div><div class="goal-pct">${p}% of target</div>`;}function goalCard(label,c,t,unit,note,active){  const fv=unit==='%'?c+'%':Math.round(c).toLocaleString();  const ft=unit==='%'?t+'%':Math.round(t).toLocaleString();  return`<div class="goal-card">    <div class="goal-header"><div class="goal-name">${label}</div>${ragBadge(c,t,active)}</div>    <div class="goal-numbers"><div class="goal-current">${fv}</div><div class="goal-target">/ ${ft} target</div></div>    ${progressBar(c,t,active)}    ${note?`<div style="font-family:-apple-system,sans-serif;font-size:10px;color:var(--text-muted);margin-top:7px;padding-top:7px;border-top:1px solid var(--border);line-height:1.5;">${note}</div>`:''}  </div>`;}function parseCSV(text){  const lines=text.trim().split('\n');  if(lines.length<2)return[];  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));  return lines.slice(1).map(line=>{    const vals=[];let cur='',inQ=false;    for(const ch of line){      if(ch==='"'){inQ=!inQ;}      else if(ch===','&&!inQ){vals.push(cur.trim());cur='';}      else cur+=ch;    }    vals.push(cur.trim());    const row={};    headers.forEach((h,i)=>row[h]=(vals[i]||'').replace(/^"|"$/g,''));    return row;  });}function vn(row,key){  const m={    week:'Week',followers:'Followers',net:'NetNew',visits:'ProfileVisits',clicks:'LinkClicks',    reach:'AvgReach',er:'EngagementRate',saves:'TotalSaves',shares:'Shares',    likes:'Likes',comments:'Comments',reposts:'Reposts',numReels:'NumReels',    totalInteractions:'TotalInteractions',totalViews:'TotalViews',    postTitle:'TopPost',postType:'PostType',    postReach:'PostReach',postER:'PostER',postSaves:'PostSaves',    postLikes:'PostLikes',postComments:'PostComments',postShares:'PostShares',postReposts:'PostReposts',    fbFollowers:'FBFollowers',fbReach:'FBReach',fbER:'FBEngagementRate',    fbReactions:'FBReactions',fbShares:'FBShares',fbComments:'FBComments'  };  return parseFloat((row[m[key]]||'0').replace(/,/g,''))||0;}function vt(row,key){  const m={    monthSummary:'MonthSummary',whatWorked:'WhatWorked',whatDidnt:'WhatDidnt',    post1Title:'Post1Title',post1Type:'Post1Type',post1Worked:'Post1Worked',post1Didnt:'Post1Didnt',    post2Title:'Post2Title',post2Type:'Post2Type',post2Worked:'Post2Worked',post2Didnt:'Post2Didnt',    post3Title:'Post3Title',post3Type:'Post3Type',post3Worked:'Post3Worked',post3Didnt:'Post3Didnt'  };  return(row[m[key]]||'').trim();}function fmt(n){return Math.round(n).toLocaleString();}function pillCls(t){  if(!t)return'pill-carousel';t=t.toLowerCase();  if(t.includes('reel'))return'pill-reel';  if(t.includes('series'))return'pill-series';  return'pill-carousel';}function monthPfx(w){return(w||'').trim().split(' ')[0];}function getMonths(rows){  const seen=new Set(),order=[];  rows.forEach(r=>{const m=monthPfx(r['Week']);if(m&&!seen.has(m)){seen.add(m);order.push(m);}});  return order;}function filterRows(rows,month){return month==='all'?rows:rows.filter(r=>monthPfx(r['Week'])===month);}function deltaLbl(c,p){  if(p==null)return{label:'—',cls:'flat'};  const d=c-p;  if(d>0)return{label:`↑ ${fmt(d)} vs prev week`,cls:'up'};  if(d<0)return{label:`↓ ${fmt(Math.abs(d))} vs prev week`,cls:'down'};  return{label:'→ flat',cls:'flat'};}function aggregate(rows){  if(!rows.length)return null;  const latest=rows[rows.length-1],prev=rows.length>1?rows[rows.length-2]:null;  const sum=key=>rows.reduce((s,r)=>s+vn(r,key),0);  const avg=key=>parseFloat((sum(key)/rows.length).toFixed(2));  return{    followers:vn(latest,'followers'),net:sum('net'),visits:sum('visits'),clicks:sum('clicks'),    reach:s
